name: Build Android Native Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          ndk-version: '25.2.9519653'

      - name: Clear Blockers and Create Clean External Directory
        run: |
          rm -rf Utils Hooks ll mc /tmp/fake_ll
          mkdir -p /tmp/fake_ll/ll/api/memory
          mkdir -p /tmp/fake_ll/ll/api/event/world
          mkdir -p /tmp/fake_ll/ll/api/event/player
          mkdir -p /tmp/fake_ll/ll/api/event/server
          mkdir -p /tmp/fake_ll/ll/api/mod
          mkdir -p /tmp/fake_ll/mc/world/level
          mkdir -p /tmp/fake_ll/mc/world/actor
          ln -s . Utils
          ln -s . Hooks

      - name: Inject Mock Headers Globally
        run: |
          # 1. Inject Logger.h with the missing warn() method
          cat << 'EOF' > /tmp/fake_ll/ll/api/Logger.h
          #pragma once
          #include <string>
          namespace ll {
              class Logger { 
              public: 
                  Logger(const std::string&) {} 
                  Logger(const char*) {}
                  template<typename... Args> void info(Args...) {} 
                  template<typename... Args> void warn(Args...) {} 
                  template<typename... Args> void error(Args...) {} 
              };
              namespace api { 
                  using Logger = ::ll::Logger; 
              }
          }
          EOF

          # 2. Inject Mock Hook.h file to resolve the missing memory layout
          cat << 'EOF' > /tmp/fake_ll/ll/api/memory/Hook.h
          #pragma once
          #define LL_TYPE_INSTANCE_HOOK(...)
          #define LL_TYPE_STATIC_HOOK(...)
          EOF

          # 3. Inject Mock EventBus.h with the missing emplaceListener method
          cat << 'EOF' > /tmp/fake_ll/ll/api/event/EventBus.h
          #pragma once
          namespace ll {
              namespace event {
                  class EventBus {
                  public:
                      static EventBus& getInstance() {
                          static EventBus instance;
                          return instance;
                      }
                      template<typename T, typename F> void createListener(F&&) {}
                      template<typename T, typename F> void emplaceListener(F&&) {}
                      template<typename T> void addListener(void*) {}
                  };
              }
          }
          EOF

          # 4. Inject Mock NativeMod.h file for mod entry registration
          cat << 'EOF' > /tmp/fake_ll/ll/api/mod/NativeMod.h
          #pragma once
          namespace ll {
              namespace mod {
                  class NativeMod {
                  public:
                      NativeMod() = default;
                  };
              }
          }
          #define LL_REGISTER_MOD(...)
          EOF

          # 5. Inject Base Actor Engine Layout (Actor.h)
          cat << 'EOF' > /tmp/fake_ll/mc/world/actor/Actor.h
          #pragma once
          class Actor { public: void setModel(...) {} };
          EOF

          # 6. Inject Mob Engine Layout (Mob.h)
          cat << 'EOF' > /tmp/fake_ll/mc/world/actor/Mob.h
          #pragma once
          #include "mc/world/actor/Actor.h"
          class Mob : public Actor {};
          EOF

          # 7. Inject World Events
          cat << 'EOF' > /tmp/fake_ll/ll/api/event/world/ActorAddEvent.h
          #pragma once
          #include "mc/world/actor/Actor.h"
          namespace ll {
              namespace event {
                  class ActorAddEvent {
                  public:
                      Actor& getActor() { static Actor a; return a; }
                  };
              }
          }
          EOF

          # 8. Inject Mock Minecraft Game Engine Level Layouts (Level.h)
          cat << 'EOF' > /tmp/fake_ll/mc/world/level/Level.h
          #pragma once
          #include <string>
          #include <vector>

          class Player {
          public:
              std::string const& getUuid() const { static std::string u = "00000000-0000-0000-0000-000000000000"; return u; }
              std::string getName() const { return "Player"; }
          };

          class Level {
          public:
              std::vector<Player*> getAllPlayers() const { return std::vector<Player*>(); }
          };
          EOF

          # 9. Inject Server Events (Starting, Stopping, and Tick)
          cat << 'EOF' > /tmp/fake_ll/ll/api/event/server/ServerStartingEvent.h
          #pragma once
          namespace ll {
              namespace event {
                  class ServerStartingEvent {};
              }
          }
          EOF

          cat << 'EOF' > /tmp/fake_ll/ll/api/event/server/ServerStoppingEvent.h
          #pragma once
          namespace ll {
              namespace event {
                  class ServerStoppingEvent {};
              }
          }
          EOF

          cat << 'EOF' > /tmp/fake_ll/ll/api/event/server/ServerTickEvent.h
          #pragma once
          namespace ll {
              namespace event {
                  class ServerTickEvent {};
              }
          }
          EOF

      - name: Configure and Compile for Android
        run: |
          xmake f -p android -a arm64-v8a --ndk=$ANDROID_NDK_ROOT -m release -y
          xmake -y

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: Personalized-Android-Mod
          path: build/android/arm64-v8a/release/libPersonalized.so
