name: Build Android Native Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          ndk-version: '25.2.9519653'

      - name: Clear Blockers and Create Clean External Directory
        run: |
          rm -rf Utils Hooks ll /tmp/fake_ll
          mkdir -p /tmp/fake_ll/ll/api
          ln -s . Utils
          ln -s . Hooks

      - name: Inject Mock Headers Globally
        run: |
          cat << 'EOF' > /tmp/fake_ll/ll/api/Logger.h
          #pragma once
          namespace ll {
              class Logger { 
              public: 
                  Logger(...) {} 
                  template<typename... Args> void info(Args...) {} 
                  template<typename... Args> void error(Args...) {} 
              };
              namespace api { 
                  using Logger = ::ll::Logger; 
              }
          }
          EOF

      - name: Configure and Compile for Android
        run: |
          xmake f -p android -a arm64-v8a --ndk=$ANDROID_NDK_ROOT -m release -y
          # This appends the clean /tmp path directly to the compiler's include flag
          xmake cxflags="-I/tmp/fake_ll" -y

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: Personalized-Android-Mod
          path: build/android/arm64-v8a/release/libPersonalized.so
